[book]
title = "Ferrule"
description = "The collar that joins you to your data — a Rust-native database query CLI."
authors = ["rustpunk"]
language = "en"
src = "src"

[preprocessor.index]

[preprocessor.links]

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/rustpunk/ferrule"
edit-url-template = "https://github.com/rustpunk/ferrule/edit/main/docs/src/{path}"
site-url = "/ferrule/"
additional-css = []
additional-js = ["theme/cloudflare-active-fix.js"]

[output.html.playground]
runnable = false

[output.html.fold]
enable = true
level = 0
