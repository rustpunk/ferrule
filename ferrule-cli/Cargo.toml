[package]
name = "ferrule-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ferrule"
path = "src/main.rs"

[features]
default = ["ferrule-core/postgres", "ferrule-core/mysql", "ferrule-core/mssql", "ferrule-core/sqlite"]
all = ["ferrule-core/oracle", "ferrule-core/ssh"]
oracle = ["ferrule-core/oracle"]
ssh = ["ferrule-core/ssh"]
# Harlequin-style terminal UI (`ferrule tui`). Off by default like
# `ssh`/`oracle`. NOT folded into `all` (which stays backend-only), but
# CI's `cargo clippy --all-features` and `cargo doc --workspace` DO turn
# it on, so every line of the tui module must stay clippy- and
# rustdoc-clean. Pulls in ratatui 0.29, whose bundled crossterm backend
# matches the crossterm 0.28 pin below (do not bump to ratatui 0.30,
# which needs crossterm 0.29 and would split the version in-tree).
tui = ["dep:ratatui"]

[dependencies]
# The extracted SQL driver core: neutral Value/Row types, DatabaseUrl
# parser, the Connection trait + per-backend drivers, the connect
# dispatcher (incl. SSH-tunnel transport under `ssh`), transaction
# helpers, the copy/bulk write path, the Dialect classifier, and the
# SqlError error type. Consumed directly by the CLI command tree; the
# backend feature flags below stay forwarded through ferrule-core (which
# in turn forwards to ferrule-sql), so cargo's per-crate feature
# unification keeps the ssh-gated `connect_with_tunnel` available to the
# CLI whenever the CLI's `ssh` feature is on.
ferrule-sql = { path = "../ferrule-sql" }
ferrule-core = { path = "../ferrule-core" }
ferrule-config = { path = "../ferrule-config" }

clap = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
miette = { workspace = true }
is-terminal = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }

chrono = { workspace = true }
crossterm = "0.28"
notify = "8"

# Harlequin-style terminal UI backend (the `tui` feature). Default
# features include the crossterm backend, which resolves to the same
# crossterm 0.28 pinned directly above — one crossterm version in-tree.
ratatui = { version = "0.29", optional = true }

rpassword = { workspace = true }
rustyline = "15"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
jmespath = "0.5"
dashmap = "6"
dirs = { workspace = true }
indexmap = { workspace = true }
hasp = { path = "../../hasp/crates/hasp", default-features = false, features = ["env", "keyring", "file"] }

# Persistent query history store (R4 / #4).
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

# Result-cache key derivation (R5 / #5). Already a workspace transitive
# via ferrule-core; promoted to a direct dep so cache.rs doesn't pierce
# the core abstraction for one hash call.
sha2 = "0.10"
