[package]
name = "ferrule-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:uuid", "dep:rust_decimal", "dep:rustls"]
mysql = ["dep:mysql_async"]
mssql = ["dep:tiberius", "dep:tokio-util"]
sqlite = ["dep:rusqlite"]
oracle = ["dep:oracle"]
ssh = ["dep:russh", "dep:pkcs5"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
url = { workspace = true }
tabled = { workspace = true }
csv = "1"
serde-saphyr = "0.0.24"
secrecy = { workspace = true }
async-trait = "0.1"
rust_decimal = { version = "1", optional = true, features = ["db-tokio-postgres"] }

# Postgres
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.13", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "0.26", optional = true }
uuid = { workspace = true, optional = true }

# MySQL
mysql_async = { version = "0.35", optional = true }

# MSSQL
tiberius = { version = "0.12", optional = true, features = ["chrono"] }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"], optional = true }

# Oracle
oracle = { version = "0.6", optional = true, features = ["chrono"] }

# SSH tunnel (opt-in via the `ssh` feature). russh 0.60 ships the
# `keys` module in the main crate (russh-keys is a separate-but-stale
# 0.49.x crate; do not pull it in).
russh = { version = "0.60", optional = true }

# Resolver pin: russh 0.60.1's transitive pkcs8 0.11.0-rc.11 calls
# the pre-rename `pkcs5::pbes2::Parameters::recommended` API. pkcs5
# 0.8.0 (released 2026-04-24, after russh 0.60.1) renamed it to
# `generate_recommended`. Pin pkcs5 to the last pre-release until
# pkcs8 ships an RC that uses the new name; bump together with
# the next russh upgrade.
pkcs5 = { version = "=0.8.0-rc.13", optional = true }
