[package]
name = "ferrule-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Connection registry, profiles, and the layered credential-resolution stack (CLI flag / env / OS keyring / file via hasp) for the ferrule database CLI."
documentation = "https://docs.rs/ferrule-config"
readme = "README.md"
keywords = ["database", "credentials", "keyring", "config", "ferrule"]
categories = ["database"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
secrecy = { workspace = true }
indexmap = { workspace = true }
chrono = { workspace = true }
hasp = { path = "../../hasp/crates/hasp", version = "0.2.0-alpha", default-features = false, features = ["env", "keyring", "file"] }

[dev-dependencies]
tempfile = "3"
